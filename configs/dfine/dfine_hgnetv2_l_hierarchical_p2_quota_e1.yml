__include__: [
  '../../../dataset/aic_hierarchical_detection.yml',
  '../../../runtime.yml',
  '../../include/optimizer.yml',
  '../../include/dfine_hgnetv2.yml',
]

output_dir: ./output/dfine_hgnetv2_l_hierarchical_p2_quota_e1
model: DFINE
criterion: HierarchicalDFINECriterion
postprocessor: HierarchicalDFINEPostProcessor
eval_spatial_size: [1024, 1024]

DFINE: {backbone: HGNetv2, encoder: P2HybridEncoder, decoder: HierarchicalDFINETransformer}

HGNetv2:
  name: 'B4'
  return_idx: [0, 1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True
  pretrained: False

P2HybridEncoder:
  p2_in_channels: 128
  p2_stride: 4
  in_channels: [512, 1024, 2048]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.
  enc_act: 'gelu'
  expansion: 1.0
  depth_mult: 1
  act: 'silu'

HierarchicalDFINETransformer:
  feat_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  num_levels: 4
  num_layers: 6
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 3, 6, 3]
  cross_attn_method: default
  query_select_method: agnostic
  # P2 emits local candidates, but cannot displace the stable 250 P3-P5 slots.
  query_select_start_level: 0
  p2_query_quota: 50
  anchor_grid_size: 0.025

HierarchicalDFINECriterion:
  weight_dict: {loss_defectness: 1, loss_class: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['hierarchical', 'boxes', 'local']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  class_label_smoothing: 0.05
  class_focal_gamma: 1.0
  class_weights: [0.645, 1.231, 1.138, 0.964, 0.943, 1.035, 0.533, 1.079, 1.433]
  matcher:
    type: HierarchicalHungarianMatcher
    weight_dict: {cost_objectness: 2, cost_bbox: 5, cost_giou: 2}

HierarchicalDFINEPostProcessor: {num_top_queries: 300, score_mode: objectness}

# Gate stage: all A0 parameters have lr=0. Only the new P2 fusion/projection
# and quota selector learn, so the 250 inherited proposal slots do not drift.
optimizer:
  type: AdamW
  params:
    - {params: '^encoder\.p2_.*\.0\.weight$', lr: 0.00015}
    - {params: '^encoder\.p2_.*\.1\.(?:weight|bias)$', lr: 0.00015, weight_decay: 0.}
    - {params: '^decoder\.p2_query_score_head\.(?:weight|bias)$', lr: 0.00015}
  lr: 0.0
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epochs: 2
print_freq: 20
checkpoint_freq: 1
train_dataloader:
  total_batch_size: 18
  num_workers: 4
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1024, 1024]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 2
        ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
  collate_fn:
    base_size: 1024
    stop_epoch: 2
    ema_restart_decay: 0.9999
    base_size_repeat: ~

val_dataloader:
  total_batch_size: 8
  num_workers: 4
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [1024, 1024]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}

ema: {decay: 0.9999, warmups: 1000}
lr_warmup_scheduler: {warmup_duration: 0}
