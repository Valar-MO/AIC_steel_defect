__include__: [
  '../../../dataset/aic_hierarchical_detection.yml',
  '../../../runtime.yml',
  '../../include/dataloader.yml',
  '../../include/optimizer.yml',
  '../../include/dfine_hgnetv2.yml',
]

output_dir: ./output/dfine_hgnetv2_l_hierarchical_objectness_rank_v1
model: HierarchicalObjectnessRankingDFINE
criterion: HierarchicalDFINECriterion
postprocessor: HierarchicalDFINEPostProcessor
eval_spatial_size: [1024, 1024]

HierarchicalObjectnessRankingDFINE:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: HierarchicalDFINETransformer
  train_all_decoder_objectness_heads: True

HGNetv2:
  name: 'B4'
  return_idx: [1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True
  pretrained: False

HierarchicalDFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_layers: 6
  eval_idx: -1
  num_queries: 300
  # Ranking uses the ordinary one-to-one queries only. Disabling denoising
  # avoids training the objectness head on synthetic noisy query groups.
  num_denoising: 0
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 6, 3]
  cross_attn_method: default
  query_select_method: agnostic

HierarchicalDFINECriterion:
  weight_dict: {
    loss_defectness: 0.25,
    loss_hard_background_rank: 1.0,
    loss_duplicate_rank: 1.0,
  }
  losses: ['hierarchical']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  class_label_smoothing: 0.05
  class_focal_gamma: 1.0
  class_weights: [0.645, 1.231, 1.138, 0.964, 0.943, 1.035, 0.533, 1.079, 1.433]
  hard_background_topk: 20
  hard_background_max_iou: 0.10
  hard_background_rank_margin: 0.50
  duplicate_topk: 3
  duplicate_iou: 0.50
  duplicate_rank_margin: 0.50
  rank_positive_min_iou: 0.50
  matcher:
    type: HierarchicalHungarianMatcher
    weight_dict: {cost_objectness: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0

HierarchicalDFINEPostProcessor:
  num_top_queries: 300
  score_mode: objectness

optimizer:
  type: AdamW
  params:
    - {params: 'decoder.dec_score_head', lr: 0.0001}
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epochs: 4
print_freq: 10
checkpoint_freq: 1
train_dataloader:
  total_batch_size: 96
  num_workers: 4
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1024, 1024]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy: {epoch: 4}
  collate_fn:
    base_size: 1024
    stop_epoch: 4
    ema_restart_decay: 0.9999
    base_size_repeat: ~

val_dataloader:
  total_batch_size: 4
  num_workers: 4
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [1024, 1024]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}

ema: {decay: 0.9999, warmups: 200}
lr_warmup_scheduler: {warmup_duration: 0}
