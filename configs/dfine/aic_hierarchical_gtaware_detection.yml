task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']

num_classes: 9
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: GTAwareBatchMixDataset
    # One physical batch-28 policy block:
    # 14 base + 5 qilie + 5 huashang + 4 yiwuyaru.
    pattern: [base, base, qilie, huashang,
              base, base, qilie, huashang,
              base, base, qilie, huashang,
              base, base, qilie, huashang,
              base, base, qilie, yiwuyaru,
              base, base, huashang, yiwuyaru,
              base, base, yiwuyaru, yiwuyaru]
    epoch_size: 8680
    seed: 42
    dataset:
      type: CocoDetection
      img_folder: /root/autodl-tmp/datasets/AIC_steel_defect_gtaware_e1
      ann_file: /root/autodl-tmp/datasets/AIC_steel_defect_gtaware_e1/annotations/instances_train.json
      return_masks: False
      transforms:
        type: Compose
        ops: ~
  # The wrapper performs deterministic epoch shuffling while retaining the
  # exact group pattern; DataLoader-level shuffling would destroy the ratio.
  shuffle: False
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /root/autodl-tmp/datasets/AIC_steel_defect_gtaware_e1
    ann_file: /root/autodl-tmp/datasets/AIC_steel_defect_gtaware_e1/annotations/instances_val.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
